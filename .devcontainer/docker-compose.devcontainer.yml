services:
  dev:
    image: ghcr.io/nhaef/devcontainer-bun:latest
    container_name: ssmb-dev
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
