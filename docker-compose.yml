name: super-smash-mobs-brawl

services:
  minecraft:
    build:
      context: ./plugin
      dockerfile: Dockerfile
    container_name: ssmb-minecraft
    restart: unless-stopped
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    environment:
      MEMORY_SIZE: ${MINECRAFT_MEMORY:-4G}
      ONLINE_MODE: ${ONLINE_MODE:-TRUE}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-25565}
      AXIOM_API_TOKEN: ${AXIOM_API_TOKEN}
      AXIOM_DATASET_NAME: ${AXIOM_DATASET_NAME}
    stdin_open: true
    tty: true
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ssmb-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-1337}:1337"
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-1337}
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ssmb-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_BACKEND_URL: http://localhost:${BACKEND_PORT:-1337}
      VITE_SERVER_BACKEND_URL: ${VITE_SERVER_BACKEND_URL-http://localhost:${BACKEND_PORT:-1337}}
