name: super-smash-mobs-brawl

services:
  database:
    image: postgres:18
    container_name: ssmb-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brawl}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.migrate
    container_name: ssmb-migrate
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-brawl}@database:5432/postgres"
    command: ["bun", "run", "db:migrate"]
    restart: "no"
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: ssmb-api
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-changeme}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_SUCCESS_URL: ${POLAR_SUCCESS_URL:-http://localhost:3001/checkout/success}
      PLUGIN_SECRET_KEY: ${PLUGIN_SECRET_KEY:-changeme}
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-brawl}@database:5432/postgres"
    ports:
      - "0.0.0.0:3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/hc"]
      interval: 5s
      timeout: 5s
      retries: 5
  drizzle_gate:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: always
    ports:
      - "0.0.0.0:4983:4983"
    environment:
      MASTERPASS: ${MASTERPASS:-changeme}
    volumes:
      - drizzle_gate:/app

  minecraft:
    build:
      context: ./plugin
      dockerfile: Dockerfile
    container_name: ssmb-minecraft
    depends_on:
      api:
        condition: service_healthy
    environment:
      MEMORY_SIZE: ${MINECRAFT_MEMORY:-5G}
      ONLINE_MODE: ${ONLINE_MODE:-false}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-25565}
      AXIOM_API_TOKEN: ${AXIOM_API_TOKEN:-}
      AXIOM_DATASET_NAME: ${AXIOM_DATASET_NAME:-super-smash-mobs-brawl}
      BASE_API_URL: ${BASE_API_URL:-http://api:3000/api}
      API_SECRET_KEY: ${API_SECRET_KEY:-changeme}
    ports:
      - "0.0.0.0:${MINECRAFT_PORT:-25565}:${MINECRAFT_PORT:-25565}"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  db_data:
  drizzle_gate:
