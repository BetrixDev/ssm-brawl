name: super-smash-mobs-brawl

services:
  postgres:
    image: postgres
    container_name: super-smash-mobs-brawl-postgres
    environment:
      POSTGRES_DB: super-smash-mobs-brawl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - super-smash-mobs-brawl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  super-smash-mobs-brawl_postgres_data: