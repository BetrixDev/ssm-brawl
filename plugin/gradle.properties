# Gradle properties for Super Smash Mobs Brawl plugin

# Gradle daemon and performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# JVM options for better performance
org.gradle.jvmargs=-Xmx2g -Xms1g -XX:+UseG1GC -XX:+UseStringDeduplication

# Kotlin configuration
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.incremental.js=true
kotlin.incremental.js.klib=true

# Build optimization
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# Plugin project specific
minecraft.version=1.21.6
java.version=21