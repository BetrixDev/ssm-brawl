prefix: "<#585b70>[<gradient:#cba6f7:#585b70>Brawl</gradient><#585b70>]<reset>"
messages:
  debug: "{lang:prefix} <#4c4f69>[DEBUG] {message}"
  kick:
    serverStarting: "Server is still starting! Please come back in a moment"
  commands:
    onlyPlayers: "<red>Only players can execute this command</red>"
    debug:
      enabled: "<green>Debug mode enabled!</green>"
      disabled: "<red>Debug mode disabled!</red>"
  queue:
    leave:
      notInQueue: "{lang:prefix} <#f2b8c6>You are not currently in a queue<#e8edff>"
      success: "{lang:prefix} <#e8edff>You have left the queue for <#8bd5ff>{lang:minigames.{minigameId}.name}"
    join:
      success: "{lang:prefix} <#e8edff>You have joined the queue for <#8bd5ff>{lang:minigames.{minigameId}.name}"
      alreadyInQueue: "{lang:prefix} <#f2b8c6>You are already in a queue for <#8bd5ff>{lang:minigames.{minigameId}.name}<newline>leave that one before joining a new one<#e8edff>"
      alreadyInMinigame: "{lang:prefix} <#f2b8c6>You are already in a game: <#8bd5ff>{lang:minigames.{minigameId}.name}"
      party:
        onlyLeader: "{lang:prefix} <#f2b8c6>Only the party leader (<#fab387>{leaderName}</#fab387>) can queue the party"
        notAllowedRanked: "{lang:prefix} <#f2b8c6>Ranked modes do not allow parties for <#8bd5ff>{lang:minigames.{minigameId}.name}"
        notAllowed: "{lang:prefix} <#f2b8c6>Parties are not allowed for <#8bd5ff>{lang:minigames.{minigameId}.name}"
        tooLarge: "{lang:prefix} <#f2b8c6>Your party is too large for <#8bd5ff>{lang:minigames.{minigameId}.name}</#8bd5ff> <#e8edff>(<#89dceb>{size}</#89dceb>/<#89b4fa>{max}</#89b4fa>)"
        memberInQueue: "{lang:prefix} <#f2b8c6>Party member <#fab387>{playerName}</#fab387> is already in a queue"
        memberInMinigame: "{lang:prefix} <#f2b8c6>Party member <#fab387>{playerName}</#fab387> is already in a minigame"
        queuedByLeader: "{lang:prefix} <#e8edff>Party leader <#a6e3a1>{leaderName}</#a6e3a1> queued you for <#8bd5ff>{lang:minigames.{minigameId}.name}"
    status:
      inQueue: "{lang:prefix} <#e8edff>You are currently in the queue for <#8bd5ff>{lang:minigames.{minigameId}.name}"
      notInQueue: "{lang:messages.queue.leave.notInQueue}"
  abilities:
    hotbarItemTitle: "<#91d7e3>{lang:abilities.{abilityId}.name}"
    hotbarItemDescription: "<#cad3f5>{lang:abilities.{abilityId}.description}"
    cooldown: "{lang:prefix} <red>{lang:abilities.{abilityId}.name}</red> <#e8edff>is on cooldown for</#e8edff> <yellow>{seconds}s</yellow>!"
    readyToActivate: "{lang:prefix} <#8bd5ff>{lang:abilities.{abilityId}.name} <#e8edff>is ready to activate"
    use:
      success: "{lang:prefix} <#e8edff>Activated <#8bd5ff>{lang:abilities.{abilityId}.name}"
      cooldown: "{lang:prefix} <red>{lang:abilities.{abilityId}.name}</red> <#e8edff>is on cooldown for</#e8edff> <yellow>{seconds}s</yellow>!"
    explode:
      alreadyCharging: "<red>Already charging explosion!</red>"
  kits:
    select:
      success: "{lang:prefix} <#e8edff>You have selected kit <#8bd5ff>{lang:kits.{kitId}.name}"
      success_never: "{lang:prefix} <#e8edff>You have selected kit <#8bd5ff>{lang:kits.{kitId}.name}<#e8edff>, but kit switching is disabled in this minigame"
      success_on_death: "{lang:prefix} <#e8edff>You have selected kit <#8bd5ff>{lang:kits.{kitId}.name}<#e8edff>. Your kit will switch after you respawn"
      success_immediate: "{lang:prefix} <#e8edff>You have selected and switched to kit <#8bd5ff>{lang:kits.{kitId}.name}"
  players:
    joinServer: "{lang:prefix} <#8bd5ff>{playerName} <#e8edff>has joined the server"
  minigames:
    leave:
      success: "{lang:prefix} <#e8edff>You have left <#8bd5ff>{lang:minigames.{minigameId}.name}"
      notAllowed: "{lang:prefix} <#f2b8c6>You are not allowed to leave this game"
      notInGame: "{lang:prefix} <#f2b8c6>You are not in a game"
      unknown: "{lang:prefix} <#f2b8c6>An unknown error occurred. Please try again"
    respawn:
      timeLeft: "<#8bd5ff>{secondsLeft}"
    teamBasedStocks:
      winner: "{lang:prefix} <#e8edff>Team <#a6e3a1>{winners}</#a6e3a1> <#e8edff>won <#8bd5ff>{lang:minigames.{minigameId}.name}</#8bd5ff>!"
  passives:
    hunger:
      attackToRestore: "<red>Attack other players to restore hunger!</red>"
  projectiles:
    arrow: "Arrow"
    barrage_arrow: "Barrage Arrow"
gui:
  kitSelection:
    title: "<!i><#1e1e2e><shadow:#585b70>Select a kit"
    kitName: "<!i><#e8edff>{lang:kits.{kitId}.name}"
    selectedKitName: "<!i><#a6e3a1>✔ Selected <#a6adc8>- <#e8edff>{lang:kits.{kitId}.name}"
    abilityList:
      title: "<!i><#a6adc8>Abilities"
      entry: "<!i><#a6adc8>• <#fab387>{lang:abilities.{abilityId}.name}"
motd: "<#89dceb>The brawl reborn <#a6adc8>-- <#89dceb>a wondrous thing<#94e2d5>!"
scoreboards:
  common:
    title: "<bold><transition:#f5c2e7:#cba6f7:#f5c2e7:{percent}>SSM Brawl</transition></bold>"
    divider: "<#1e1e2e><st>                           "
    tab:
      header: "<gradient:#89b4fa:#cba6f7:#f5c2e7>Super Smash Mobs: Brawl</gradient>"
      footer: "<#f5c2e7>play.ssmbrawl.com"
  queue:
    header:
      in_queue: "<#45475a>» <#cdd6f4>In Queue"
    content:
      players_label: "<#45475a>» <#a6e3a1>Players"
      players_count: "<#89dceb>{current}<#b4befe> / <#89b4fa>{required}"
      time_label: "<#45475a>» <#f9e2af>Time"
      time_value: "<#fab387>{seconds}s"
    tab:
      header: "<#a6e3a1>In Queue: <#f5c2e7>{lang:minigames.{minigameId}.name}"
      footer: "<#cdd6f4>Players: <#89dceb>{current}<#b4befe> / <#89b4fa>{required}<newline><#f9e2af>Queue Time: <#fab387>{seconds}s"
  hub:
    content:
      player_info: "<#45475a>» <#cdd6f4>Player <#a6e3a1>{player}"
      online_count: "<#b4befe>Online <#89dceb>{current}<#b4befe> / <#89b4fa>{max}"
    tab:
      header: "<#a6e3a1>Welcome, <#f5c2e7>{player}"
      footer: "<#ffffff>Players: <#89dceb>{current} <#6c7086>/ <#cba6f7>{max}"
