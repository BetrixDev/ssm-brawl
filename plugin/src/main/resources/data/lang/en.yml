prefix: "<ui-shadow>[<gradient:accent:ui-shadow>Brawl</gradient><ui-shadow>]<reset>"
messages:
  debug: "{lang:prefix} <text-dark>[DEBUG] {message}"
  kick:
    serverStarting: "Server is still starting! Please come back in a moment"
  commands:
    onlyPlayers: "<warning>Only players can execute this command</warning>"
    debug:
      enabled: "<success>Debug mode enabled!</success>"
      disabled: "<warning>Debug mode disabled!</warning>"
  queue:
    leave:
      notInQueue: "{lang:prefix} <danger>You are not currently in a queue<text>"
      success: "{lang:prefix} <text>You have left the queue for <primary>{lang:minigames.{minigameId}.name}"
    join:
      success: "{lang:prefix} <text>You have joined the queue for <primary>{lang:minigames.{minigameId}.name}"
      alreadyInQueue: "{lang:prefix} <danger>You are already in a queue<newline>leave that one before joining a new one<text>"
    status:
      inQueue: "{lang:prefix} <text>You are currently in the queue for <primary>{lang:minigames.{minigameId}.name}"
      notInQueue: "{lang:messages.queue.leave.notInQueue}"
  abilities:
    hotbarItemTitle: "<primary-soft>{lang:abilities.{abilityId}.name}"
    hotbarItemDescription: "<text-muted>{lang:abilities.{abilityId}.description}"
    cooldown: "{lang:prefix} <warning>{lang:abilities.{abilityId}.name}</warning> <text>is on cooldown for</text> <yellow>{seconds}s</yellow>!"
    readyToActivate: "{lang:prefix} <primary>{lang:abilities.{abilityId}.name} <text>is ready to activate"
    use:
      success: "{lang:prefix} <text>Activated <primary>{lang:abilities.{abilityId}.name}"
      cooldown: "{lang:prefix} <warning>{lang:abilities.{abilityId}.name}</warning> <text>is on cooldown for</text> <yellow>{seconds}s</yellow>!"
    explode:
      alreadyCharging: "{lang:prefix} <warning>Already charging explosion!</warning>"
    targetLaser:
      alreadyTargeting: "{lang:prefix} <warning>Already targeting a player!</warning>"
      mustBeOnGround: "{lang:prefix} <warning>You must be on the ground to use {lang:abilities.{abilityId}.name}!</warning>"
      noTargetsInRange: "{lang:prefix} <warning>No targets within range!</warning>"
      targeted: "{lang:prefix} <text>You targeted <primary>{target}</primary> <text>with <primary>{lang:abilities.{abilityId}.name}"
      targetedBy: "{lang:prefix} <warning>{attacker}</warning> <text>targeted you with their <warning>{lang:abilities.{abilityId}.name}"
      laserBroke: "{lang:prefix} <text>Your laser broke, dealing damage to <primary>{target}"
  kits:
    select:
      success: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}"
      success_never: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}<text>, but kit switching is disabled in this minigame"
      success_on_death: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}<text>. Your kit will switch after you respawn"
      success_immediate: "{lang:prefix} <text>You have selected and switched to kit <primary>{lang:kits.{kitId}.name}"
      already_selected: "{lang:prefix} <text>You already have kit <primary>{lang:kits.{kitId}.name}<text> selected"
  players:
    joinServer: "{lang:prefix} <primary>{playerName} <text>has joined the server"
  minigames:
    leave:
      success: "{lang:prefix} <text>You have left <primary>{lang:minigames.{minigameId}.name}"
      notAllowed: "{lang:prefix} <danger>You are not allowed to leave this game"
      notInGame: "{lang:prefix} <danger>You are not in a game"
      unknown: "{lang:prefix} <danger>An unknown error occurred. Please try again"
    respawn:
      timeLeft: "<primary>{secondsLeft}"
    teamBasedStocks:
      winner: "{lang:prefix} <text>Team <success>{winners}</success> <text>won <primary>{lang:minigames.{minigameId}.name}</primary>!"
  passives:
    double_jump:
      name: "Double Jump"
      description: "Leap twice to reposition midair"
    regeneration:
      name: "Regeneration"
      description: "Passively recover small amounts of health"
    hunger:
      name: "Hunger"
      description: "Restore hunger by striking opponents"
      attackToRestore: "<warning>Attack other players to restore hunger!</warning>"
    corrupted_arrow:
      name: "Corrupted Arrow"
      description: "Build Corrupted Energy by dealing damage to scale arrow power from 5-12 damage. Energy decays after 3 seconds of inactivity"
    wall_climb:
      name: "Wall Climb"
      description: "Hold sneak on a wall to climb and regain a midair reset"
    spider_leap:
      name: "Spider Leap"
      description: "Double jump in any direction you face for rapid mobility"
    nether_pig:
      name: "Nether Pig"
      description: "Gain fiery resilience when your health nears collapse"
  giga_slime:
    name: "Giga Slime"
    description: "Grow larger, leap farther, and accelerate regen as momentum builds"
  arctic_aura:
    name: "Arctic Aura"
    description: "Radiate chilling snow that slows enemies and empowers your strikes"
  overgrowth:
    name: "Overgrowth"
    description: "Gain absorption hearts based on damage dealt, rewarding aggressive combos"
  projectiles:
    arrow: "Arrow"
    barrage_arrow: "Barrage Arrow"
gui:
  kitSelection:
    title: "<!i><ui-bg><shadow:ui-shadow>Select a kit"
    kitName: "<!i><text>{lang:kits.{kitId}.name}"
    selectedKitName: "<!i><success>✔ Selected <secondary>- <text>{lang:kits.{kitId}.name}"
    abilityList:
      title: "<!i><secondary>Abilities"
      entry: "<!i><secondary>• <accent-warm>{lang:abilities.{abilityId}.name}"
    passiveList:
      title: "<!i><secondary>Passive"
      entry: "<!i><secondary>• <accent-warm>{lang:passives.{abilityId}.name}"
motd: "<info>The brawl reborn <secondary>-- <info>a wondrous thing<accent-teal>!"
