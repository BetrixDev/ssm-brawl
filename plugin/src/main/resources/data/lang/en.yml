    name: "1v1 Duels"
    description: "A competitive 1v1 game mode"
prefix: "<ui-shadow>[<gradient:accent:ui-shadow>Brawl</gradient><ui-shadow>]<reset>"
messages:
  debug: "{lang:prefix} <text-dark>[DEBUG] {message}"
  kick:
    serverStarting: "Server is still starting! Please come back in a moment"
  commands:
    onlyPlayers: "<warning>Only players can execute this command</warning>"
    debug:
      enabled: "<success>Debug mode enabled!</success>"
      disabled: "<warning>Debug mode disabled!</warning>"
  queue:
    leave:
      notInQueue: "{lang:prefix} <danger>You are not currently in a queue<text>"
      success: "{lang:prefix} <text>You have left the queue for <primary>{lang:minigames.{minigameId}.name}"
    join:
      success: "{lang:prefix} <#e8edff>You have joined the queue for <#8bd5ff>{lang:minigames.{minigameId}.name}"
      alreadyInQueue: "{lang:prefix} <#f2b8c6>You are already in a queue for <#8bd5ff>{lang:minigames.{minigameId}.name}<newline>leave that one before joining a new one<#e8edff>"
      alreadyInMinigame: "{lang:prefix} <#f2b8c6>You are already in a game: <#8bd5ff>{lang:minigames.{minigameId}.name}"
      party:
        onlyLeader: "{lang:prefix} <#f2b8c6>Only the party leader (<#fab387>{leaderName}</#fab387>) can queue the party"
        notAllowedRanked: "{lang:prefix} <#f2b8c6>Ranked modes do not allow parties for <#8bd5ff>{lang:minigames.{minigameId}.name}"
        notAllowed: "{lang:prefix} <#f2b8c6>Parties are not allowed for <#8bd5ff>{lang:minigames.{minigameId}.name}"
        tooLarge: "{lang:prefix} <#f2b8c6>Your party is too large for <#8bd5ff>{lang:minigames.{minigameId}.name}</#8bd5ff> <#e8edff>(<#89dceb>{size}</#89dceb>/<#89b4fa>{max}</#89b4fa>)"
        memberInQueue: "{lang:prefix} <#f2b8c6>Party member <#fab387>{playerName}</#fab387> is already in a queue"
        memberInMinigame: "{lang:prefix} <#f2b8c6>Party member <#fab387>{playerName}</#fab387> is already in a minigame"
        queuedByLeader: "{lang:prefix} <#e8edff>Party leader <#a6e3a1>{leaderName}</#a6e3a1> queued you for <#8bd5ff>{lang:minigames.{minigameId}.name}"
    status:
      inQueue: "{lang:prefix} <text>You are currently in the queue for <primary>{lang:minigames.{minigameId}.name}"
      notInQueue: "{lang:messages.queue.leave.notInQueue}"
  abilities:
    hotbarItemTitle: "<primary-soft>{lang:abilities.{abilityId}.name}"
    hotbarItemDescription: "<text-muted>{lang:abilities.{abilityId}.description}"
    cooldown: "{lang:prefix} <warning>{lang:abilities.{abilityId}.name}</warning> <text>is on cooldown for</text> <yellow>{seconds}s</yellow>!"
    readyToActivate: "{lang:prefix} <primary>{lang:abilities.{abilityId}.name} <text>is ready to activate"
    use:
      success: "{lang:prefix} <text>Activated <primary>{lang:abilities.{abilityId}.name}"
      cooldown: "{lang:prefix} <warning>{lang:abilities.{abilityId}.name}</warning> <text>is on cooldown for</text> <yellow>{seconds}s</yellow>!"
    explode:
      alreadyCharging: "{lang:prefix} <warning>Already charging explosion!</warning>"
  kits:
    select:
      success: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}"
      success_never: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}<text>, but kit switching is disabled in this minigame"
      success_on_death: "{lang:prefix} <text>You have selected kit <primary>{lang:kits.{kitId}.name}<text>. Your kit will switch after you respawn"
      success_immediate: "{lang:prefix} <text>You have selected and switched to kit <primary>{lang:kits.{kitId}.name}"
  players:
    joinServer: "{lang:prefix} <primary>{playerName} <text>has joined the server"
  minigames:
    leave:
      success: "{lang:prefix} <text>You have left <primary>{lang:minigames.{minigameId}.name}"
      notAllowed: "{lang:prefix} <danger>You are not allowed to leave this game"
      notInGame: "{lang:prefix} <danger>You are not in a game"
      unknown: "{lang:prefix} <danger>An unknown error occurred. Please try again"
    respawn:
      timeLeft: "<#8bd5ff>{secondsLeft}"
    countdown:
      seconds: "<bold><#89b4fa>{seconds}</#89b4fa></bold>"
      prep: "<#a6adc8>Get ready..."
      go: "<bold><#a6e3a1>GO!</#a6e3a1></bold>"
      good_luck: "<#a6adc8>Good luck!"
    teamBasedStocks:
      winner: "{lang:prefix} <text>Team <success>{winners}</success> <text>won <primary>{lang:minigames.{minigameId}.name}</primary>!"
  passives:
    hunger:
      attackToRestore: "<warning>Attack other players to restore hunger!</warning>"
  projectiles:
    arrow: "Arrow"
    barrage_arrow: "Barrage Arrow"
gui:
  kitSelection:
    title: "<!i><ui-bg><shadow:ui-shadow>Select a kit"
    kitName: "<!i><text>{lang:kits.{kitId}.name}"
    selectedKitName: "<!i><success>✔ Selected <secondary>- <text>{lang:kits.{kitId}.name}"
    abilityList:
      title: "<!i><#a6adc8>Abilities"
      entry: "<!i><#a6adc8>• <#fab387>{lang:abilities.{abilityId}.name}"
motd: "<#89dceb>The brawl reborn <#a6adc8>-- <#89dceb>a wondrous thing<#94e2d5>!"
scoreboards:
  common:
    title: "<bold><transition:#f5c2e7:#cba6f7:#f5c2e7:{percent}>SSM Brawl</transition></bold>"
    divider: "<#1e1e2e><st>                           "
    tab:
      header: "<gradient:#89b4fa:#cba6f7:#f5c2e7>Super Smash Mobs: Brawl</gradient>"
      footer: "<#f5c2e7>play.ssmbrawl.com"
  queue:
    header:
      in_queue: "<#45475a>» <#cdd6f4>In Queue"
    content:
      players_label: "<#45475a>» <#a6e3a1>Players"
      players_count: "<#89dceb>{current}<#b4befe> / <#89b4fa>{required}"
      time_label: "<#45475a>» <#f9e2af>Time"
      time_value: "<#fab387>{seconds}s"
    tab:
      header: "<#a6e3a1>In Queue: <#f5c2e7>{lang:minigames.{minigameId}.name}"
      footer: "<#cdd6f4>Players: <#89dceb>{current}<#b4befe> / <#89b4fa>{required}<newline><#f9e2af>Queue Time: <#fab387>{seconds}s"
  hub:
    content:
      player_info: "<#45475a>» <#cdd6f4>Player <#a6e3a1>{player}"
      online_count: "<#b4befe>Online <#89dceb>{current}<#b4befe> / <#89b4fa>{max}"
    tab:
      header: "<#a6e3a1>Welcome, <#f5c2e7>{player}"
      footer: "<#ffffff>Players: <#89dceb>{current} <#6c7086>/ <#cba6f7>{max}"
