passives:
  - id: double_jump
    userFacing: false
    metadata:
      # Motion tuning
      horizontalMultiplier: 0.9
      verticalBoost: 0.9
      allowMidairReset: false

  - id: hunger
    userFacing: false
    metadata:
      hungerRestoreDelayMs: 250

  - id: regeneration
    userFacing: false
    metadata:
      healAmount: 1.0
      healIntervalTicks: 60

  - id: flap
    displayItem: feather
    userFacing: true
    metadata:
      maxFlaps: 8
      energyPerFlap: 12.5
      maxEnergy: 100.0
      energyRegenRate: 4.0
      flapStrengthMultiplier: 0.95

  - id: arrow_recharge
    displayItem: bundle
    userFacing: true
    metadata:
      arrowHotbarSlot: 2
      maximumArrowCount: 3
      arrowIntervalTicks: 40

  - id: barrage
    displayItem: spectral_arrow
    userFacing: true
    metadata:
      maxCharge: 5
      arrowDamage: 6.0

  - id: stampede
    displayItem: leather
    userFacing: true
    metadata:
      stackIncreaseTimeMs: 3000
      maxStacks: 3
      stopSprintDamage: 3