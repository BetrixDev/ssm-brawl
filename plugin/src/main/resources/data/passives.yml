passives:
  - id: double_jump
    userFacing: false
    metadata:
      # Motion tuning
      horizontalMultiplier: 0.9
      verticalBoost: 0.9
      allowMidairReset: false

  - id: hunger
    userFacing: false
    metadata:
      hungerRestoreDelayMs: 250

  - id: regeneration
    userFacing: false
    metadata:
      healAmount: 1.0
      healIntervalTicks: 60

  - id: flap
    displayItem: feather
    userFacing: true
    metadata:
      maxFlaps: 8
      energyPerFlap: 12.5
      maxEnergy: 100.0
      energyRegenRate: 4.0
      flapStrengthMultiplier: 0.95

  - id: arrow_recharge
    displayItem: bundle
    userFacing: true
    metadata:
      arrowHotbarSlot: 2
      maximumArrowCount: 3
      arrowIntervalTicks: 40

  - id: barrage
    displayItem: spectral_arrow
    userFacing: true
    metadata:
      maxCharge: 5
      arrowDamage: 6.0

  - id: stampede
    displayItem: leather
    userFacing: true
    metadata:
      stackIncreaseTimeMs: 3000
      maxStacks: 3
      stopSprintDamage: 3

  - id: wall_climb
    displayItem: spider_eye
    userFacing: true
    metadata:
      climbSpeed: 0.15
      energyCostPerTick: 1.0
      maxEnergy: 100.0
      energyRegenRate: 3.0

  - id: spider_leap
    displayItem: spider_spawn_egg
    userFacing: true
    metadata:
      leapStrength: 1.25
      horizontalMultiplier: 1.0
      verticalMultiplier: 1.0

  - id: nether_pig
    displayItem: nether_wart
    userFacing: true
    metadata:
      lowHealthThreshold: 4.0

  - id: thorns
    displayItem: prismarine_shard
    userFacing: true
    metadata:
      lowHealthThreshold: 6.0
      projectileReduction: 0.2
      knockbackReduction: 0.15

  - id: corrupted_arrow
    displayItem: arrow
    userFacing: true
    metadata:
      double_damage_condition: deaths_grasp_used