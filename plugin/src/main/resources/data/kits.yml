kits:
  # Hub Kit
  - id: hub
    userFacing: false
    meleeDamage: 0.0
    armor: 1.0
    knockbackMultiplier: 1.0
    passives:
      - id: double_jump
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Creeper Kit
  - id: creeper
    meleeDamage: 6.0
    armor: 4.0
    knockbackMultiplier: 1.65
    disguiseId: "creeper"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            regenRate: 0.4
      - id: hunger
    abilities:
      - id: sulphur_bomb
      - id: explode
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
