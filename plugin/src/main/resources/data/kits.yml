kits:
  # Hub
  - id: hub
    userFacing: false
    meleeDamage: 0.0
    armor: 1.0
    knockbackMultiplier: 1.0
    passives:
      - id: double_jump
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Creeper
  - id: creeper
    meleeDamage: 6.0
    armor: 4.0
    knockbackMultiplier: 1.65
    disguiseId: "creeper"
    selectionSound: "entity.creeper.hurt"
    displayItem: "coal"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.4
      - id: hunger
    abilities:
      - id: sulphur_bomb
      - id: explode
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Skeleton
  - id: skeleton
    meleeDamage: 5.0
    armor: 6.0
    knockbackMultiplier: 1.25
    disguiseId: "skeleton"
    selectionSound: "entity.skeleton.ambient"
    displayItem: "bone"
    metadata:
      arrowKnockbackMultiplier: 1.50
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.25
      - id: hunger
      - id: arrow_recharge
        overrides:
          metadata:
            arrowIntervalTicks: 60
      - id: barrage
    abilities:
      - id: bone_explosion
      - id: roped_arrow
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Cow
  - id: cow
    meleeDamage: 6.0
    armor: 6.5
    knockbackMultiplier: 1.10
    disguiseId: "cow"
    selectionSound: "entity.cow.ambient"
    displayItem: "milk_bucket"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.25
      - id: stampede
      - id: hunger
    abilities:
      - id: angry_herd
      - id: milk_spiral
    armorItems:
      helmet: iron_helmet
      chestplate: chainmail_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Pig
  - id: pig
    meleeDamage: 5.0
    armor: 5.0
    knockbackMultiplier: 1.5
    disguiseId: "pig"
    selectionSound: "entity.pig.ambient"
    displayItem: "porkchop"
    passives:
      - id: nether_pig
    abilities:
      - id: bouncy_bacon
      - id: baby_bacon_bomb
    armorItems:
      helmet: null
      chestplate: null
      leggings: null
      boots: null

  # Enderman
  - id: enderman
    meleeDamage: 7.0
    armor: 6.0
    knockbackMultiplier: 1.25
    disguiseId: enderman
    selectionSound: "entity.enderman.teleport"
    displayItem: "ender_pearl"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.25
      - id: hunger
    abilities:
      - id: blink
      - id: block_toss
    armorItems:
      helmet: chainmail_helmet
      chestplate: chainmail_chestplate
      leggings: chainmail_leggings
      boots: chainmail_boots

  # Chicken
  - id: chicken
    meleeDamage: 9.0    # 4.5 hearts
    armor: 2.5
    knockbackMultiplier: 2.0
    disguiseId: "chicken"
    selectionSound: "entity.chicken.ambient"
    displayItem: "feather"
    passives:
      - id: flap
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.2
            healIntervalTicks: 20
    abilities:
      - id: egg_blaster
      - id: chicken_missile
    armorItems:
      chestplate: chainmail_chestplate
      boots: chainmail_boots

  # Spider
  - id: spider
    meleeDamage: 6.0
    armor: 6.0
    knockbackMultiplier: 1.5
    disguiseId: "spider"
    selectionSound: "entity.spider.ambient"
    displayItem: "cobweb"
    passives:
      - id: double_jump
        overrides:
          metadata:
            allowMidairReset: true
            horizontalMultiplier: 1.0
            verticalBoost: 1.0
      - id: wall_climb
      - id: spider_leap
      - id: regeneration
        overrides:
          metadata:
            healAmount: 0.25
    abilities:
      - id: needler
      - id: spin_web
    armorItems:
      helmet: chainmail_helmet
      chestplate: chainmail_chestplate
      boots: iron_boots

  # Witch
  - id: witch
    meleeDamage: 6.0
    armor: 5.0
    knockbackMultiplier: 1.5
    disguiseId: "witch"
    selectionSound: "entity.witch.ambient"
    displayItem: "potion"
    passives:
      - id: double_jump
      - id: regeneration
      - id: hunger
    abilities:
      - id: daze_potion
      - id: bat_wave
    armorItems:
      chestplate: chainmail_chestplate
      leggings: chainmail_leggings
      boots: chainmail_boots

  # Squid
  - id: squid
    meleeDamage: 6.0
    armor: 5.0
    knockbackMultiplier: 1.5
    disguiseId: "squid"
    selectionSound: "entity.squid.ambient"
    displayItem: "ink_sac"
    passives:
      - id: double_jump
      - id: regeneration
      - id: hunger
    abilities:
      - id: ink_shotgun
      - id: super_squid
      - id: fish_flurry
    armorItems:
      chestplate: chainmail_chestplate
      leggings: chainmail_leggings
      boots: chainmail_boots