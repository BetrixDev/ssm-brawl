kits:
  # Hub
  - id: hub
    userFacing: false
    meleeDamage: 0.0
    armor: 1.0
    knockbackMultiplier: 1.0
    passives:
      - id: double_jump
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Creeper
  - id: creeper
    meleeDamage: 6.0
    armor: 4.0
    knockbackMultiplier: 1.65
    disguiseId: "creeper"
    selectionSound: "entity.creeper.hurt"
    displayItem: "coal"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            regenRate: 0.4
      - id: hunger
    abilities:
      - id: sulphur_bomb
      - id: explode
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Skeleton
  - id: skeleton
    meleeDamage: 5.0
    armor: 6.0
    knockbackMultiplier: 1.25
    disguiseId: "skeleton"
    selectionSound: "entity.skeleton.ambient"
    displayItem: "bone"
    metadata:
      arrowKnockbackMultiplier: 1.50
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            regenRate: 0.25
      - id: hunger
      - id: arrow_recharge
        overrides:
          metadata:
            arrowIntervalTicks: 60
      - id: barrage
    abilities:
      - id: bone_explosion
      - id: roped_arrow
    armorItems:
      helmet: iron_helmet
      chestplate: iron_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Cow
  - id: cow
    meleeDamage: 6.0
    armor: 6.5
    knockbackMultiplier: 1.10
    disguiseId: "cow"
    selectionSound: "entity.cow.ambient"
    displayItem: "milk_bucket"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            regenRate: 0.25
      - id: stampede
      - id: hunger
    abilities:
      - id: angry_herd
      - id: milk_spiral
    armorItems:
      helmet: iron_helmet
      chestplate: chainmail_chestplate
      leggings: iron_leggings
      boots: iron_boots

  # Enderman
  - id: enderman
    meleeDamage: 7.0
    armor: 6.0
    knockbackMultiplier: 1.25
    disguiseId: enderman
    selectionSound: "entity.enderman.teleport"
    displayItem: "ender_pearl"
    passives:
      - id: double_jump
      - id: regeneration
        overrides:
          metadata:
            regenRate: 0.25
      - id: hunger
    abilities:
      - id: blink
      - id: block_toss
    armorItems:
      helmet: chainmail_helmet
      chestplate: chainmail_chestplate
      leggings: chainmail_leggings
      boots: chainmail_boots