# ktlint configuration for Super Smash Mobs Brawl

# Line length
max_line_length: 100

# Allow wildcard imports for convenience
disabled_rules:
  - no-wildcard-imports

# Standard formatting rules
ktlint_standard_chain-wrapping:
  disabled: false
  
ktlint_standard_condition-wrapping:
  disabled: false
  
ktlint_standard_filename:
  disabled: false
  
ktlint_standard_function-naming:
  disabled: false
  
ktlint_standard_import-ordering:
  disabled: false
  
ktlint_standard_indent:
  disabled: false
  
ktlint_standard_parameter-list-wrapping:
  disabled: false
  
ktlint_standard_trailing-comma-on-call-site:
  disabled: true  # Optional trailing commas
  
ktlint_standard_trailing-comma-on-declaration-site:
  disabled: true  # Optional trailing commas

# Enable formatting rules
ktlint_standard_spacing-around-colon:
  disabled: false
  
ktlint_standard_spacing-around-comma:
  disabled: false
  
ktlint_standard_spacing-around-curly:
  disabled: false